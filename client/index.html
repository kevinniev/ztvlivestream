<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>ZTVLIVE — Premium 24/7 Live Streaming Platform</title>
    <meta name="description" content="ZTVLIVE — Premium 24/7 live streaming platform. Watch live TV, tech, gaming, sports, movies, podcasts, news, and music. Play trivia games and win prizes." />
    <meta name="theme-color" content="#000814" />
    <meta name="robots" content="index,follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZTVLIVE" />
    <meta property="og:title" content="ZTVLIVE — Premium 24/7 Live Streaming Platform" />
    <meta property="og:description" content="Watch live TV, tech, gaming, sports, movies, podcasts, news, and music on ZTVLIVE. Free to watch. ZTVLIVE+ for ad-free streaming." />
    <meta property="og:image" content="https://ztvlivestream.com/og-image.jpg" />
    <meta property="og:url" content="https://ztvlivestream.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ztvlivestream" />
    <meta name="twitter:title" content="ZTVLIVE — Premium 24/7 Live Streaming Platform" />
    <meta name="twitter:description" content="Watch live TV, tech, gaming, sports, movies, podcasts, news, and music on ZTVLIVE." />
    <meta name="twitter:image" content="https://ztvlivestream.com/og-image.jpg" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&display=swap" rel="stylesheet" />

    <!-- Preconnect YouTube for fast video loads -->
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <!-- Structured Data: Organization + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://ztvlivestream.com/#organization",
          "name": "ZTVLIVE",
          "url": "https://ztvlivestream.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://ztvlivestream.com/og-image.jpg",
            "width": 1280,
            "height": 720
          },
          "sameAs": [
            "https://twitter.com/ztvlivestream",
            "https://www.youtube.com/@ztvlive",
            "https://www.instagram.com/ztvlivestream",
            "https://www.facebook.com/ztvlivestream"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://ztvlivestream.com/#website",
          "url": "https://ztvlivestream.com",
          "name": "ZTVLIVE",
          "description": "Premium 24/7 live streaming platform. Watch live TV, tech, gaming, sports, movies, podcasts, news, and music.",
          "publisher": { "@id": "https://ztvlivestream.com/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://ztvlivestream.com/library?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
