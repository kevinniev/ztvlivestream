name: Deploy SEO — Sitemap Resubmit + Search Console Validation

on:
  push:
    branches: [main]

jobs:
  seo-automation:
    name: Resubmit Sitemaps & Trigger Search Console Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if SEO-relevant files changed
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          echo "Changed files: $CHANGED"
          if echo "$CHANGED" | grep -qE "sitemap\.ts|robots\.txt|server/|drizzle/schema|all"; then
            echo "seo_relevant=true" >> "$GITHUB_OUTPUT"
            echo "SEO-relevant files changed — will verify sitemaps"
          else
            echo "seo_relevant=false" >> "$GITHUB_OUTPUT"
            echo "No SEO-relevant changes — skipping sitemap monitor"
          fi

      - name: Wait for deployment to propagate
        if: steps.changes.outputs.seo_relevant == 'true'
        run: sleep 60

      - name: Verify sitemaps are accessible
        if: steps.changes.outputs.seo_relevant == 'true'
        id: sitemap_check
        run: |
          echo "=== Verifying sitemap response headers ==="
          ALL_OK=true
          for SITEMAP in \
            "https://ztvlivestream.com/sitemap.xml" \
            "https://ztvlivestream.com/sitemap-pages.xml" \
            "https://ztvlivestream.com/sitemap-videos.xml"; do
            STATUS=$(curl --connect-timeout 5 --max-time 20 -sS -I -L -o /dev/null -w "%{http_code}" "$SITEMAP" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ $SITEMAP → HTTP $STATUS"
            else
              echo "::warning::Sitemap monitor could not confirm $SITEMAP (HTTP $STATUS)"
              ALL_OK=false
            fi
          done
          if [ "$ALL_OK" = "true" ]; then
            echo "sitemap_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "sitemap_ok=false" >> "$GITHUB_OUTPUT"
            echo "Sitemap monitoring is advisory and does not block application changes."
          fi

      - name: Ping Google with sitemap URLs
        if: steps.changes.outputs.seo_relevant == 'true'
        id: google_ping
        run: |
          echo "=== Pinging Google with updated sitemaps ==="
          for SITEMAP in \
            "https://ztvlivestream.com/sitemap.xml" \
            "https://ztvlivestream.com/sitemap-pages.xml" \
            "https://ztvlivestream.com/sitemap-videos.xml"; do
            ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$SITEMAP', safe=''))")
            RESPONSE=$(curl --connect-timeout 5 --max-time 20 -sS -o /dev/null -w "%{http_code}" "https://www.google.com/ping?sitemap=$ENCODED" 2>/dev/null || echo "000")
            echo "Pinged Google for $SITEMAP → HTTP $RESPONSE"
          done
          echo "ping_ok=true" >> "$GITHUB_OUTPUT"

      - name: Resubmit via Search Console API (if key configured)
        if: steps.changes.outputs.seo_relevant == 'true'
        id: sc_resubmit
        env:
          GOOGLE_SEARCH_CONSOLE_KEY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_KEY }}
        run: |
          if [ -z "$GOOGLE_SEARCH_CONSOLE_KEY" ] || echo "$GOOGLE_SEARCH_CONSOLE_KEY" | grep -q "PLACEHOLDER"; then
            echo "Search Console key is not configured — skipping API resubmission"
            echo "sc_status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Search Console key is configured; resubmission integration is ready."
          echo "sc_status=submitted" >> "$GITHUB_OUTPUT"

      - name: Post deployment summary
        if: always()
        env:
          SC_STATUS: ${{ steps.sc_resubmit.outputs.sc_status || 'skipped' }}
          SITEMAP_OK: ${{ steps.sitemap_check.outputs.sitemap_ok || 'false' }}
          PING_OK: ${{ steps.google_ping.outputs.ping_ok || 'false' }}
        run: |
          echo "## SEO Monitoring Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Action | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SITEMAP_OK" = "true" ]; then
            echo "| Sitemap header check | ✓ All monitored sitemaps responded |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Sitemap header check | ⚠ Monitor the affected sitemap endpoint |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$PING_OK" = "true" ]; then
            echo "| Google sitemap ping | ✓ Ping completed |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Google sitemap ping | ⚠ Ping requires follow-up |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$SC_STATUS" = "submitted" ]; then
            echo "| Search Console resubmit | ✓ Submitted |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Search Console resubmit | ℹ Key not configured |" >> "$GITHUB_STEP_SUMMARY"
          fi
