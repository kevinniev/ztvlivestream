name: Deploy SEO — Sitemap Resubmit + Search Console Validation

on:
  push:
    branches: [main]

jobs:
  seo-automation:
    name: Resubmit Sitemaps & Trigger Search Console Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if SEO-relevant files changed
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          echo "Changed files: $CHANGED"

          if echo "$CHANGED" | grep -qE "sitemap\.ts|robots\.txt|server/|drizzle/schema|all"; then
            echo "seo_relevant=true" >> $GITHUB_OUTPUT
            echo "✅ SEO-relevant files changed — will resubmit sitemaps"
          else
            echo "seo_relevant=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No SEO-relevant changes — skipping sitemap resubmit"
          fi

      - name: Wait for deployment to propagate
        if: steps.changes.outputs.seo_relevant == 'true'
        run: |
          echo "⏳ Waiting 60 seconds for Manus deployment to propagate..."
          sleep 60

      - name: Verify sitemaps are accessible
        if: steps.changes.outputs.seo_relevant == 'true'
        id: sitemap_check
        run: |
          echo "=== Verifying sitemaps are live ==="
          ALL_OK=true

          for SITEMAP in \
            "https://www.ztvlivestream.com/sitemap.xml" \
            "https://www.ztvlivestream.com/sitemap-pages.xml" \
            "https://www.ztvlivestream.com/sitemap-videos.xml"; do

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITEMAP")
            if [ "$STATUS" = "200" ]; then
              echo "✅ $SITEMAP → HTTP $STATUS"
            else
              echo "❌ $SITEMAP → HTTP $STATUS (expected 200)"
              ALL_OK=false
            fi
          done

          if [ "$ALL_OK" = "false" ]; then
            exit 1
          fi
          echo "sitemap_ok=true" >> $GITHUB_OUTPUT

      - name: Ping Google with sitemap URLs
        if: steps.changes.outputs.seo_relevant == 'true'
        id: google_ping
        run: |
          echo "=== Pinging Google with updated sitemaps ==="

          for SITEMAP in \
            "https://www.ztvlivestream.com/sitemap.xml" \
            "https://www.ztvlivestream.com/sitemap-pages.xml" \
            "https://www.ztvlivestream.com/sitemap-videos.xml"; do

            ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$SITEMAP', safe=''))")
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://www.google.com/ping?sitemap=$ENCODED" 2>/dev/null || echo "000")
            echo "Pinged Google for $SITEMAP → HTTP $RESPONSE"
          done

          echo "✅ Google ping complete"
          echo "ping_ok=true" >> $GITHUB_OUTPUT

      - name: Resubmit via Search Console API (if key configured)
        if: steps.changes.outputs.seo_relevant == 'true'
        id: sc_resubmit
        env:
          GOOGLE_SEARCH_CONSOLE_KEY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_KEY }}
        run: |
          # Skip if key is placeholder or empty
          if [ -z "$GOOGLE_SEARCH_CONSOLE_KEY" ] || \
             echo "$GOOGLE_SEARCH_CONSOLE_KEY" | grep -q "PLACEHOLDER"; then
            echo "ℹ️  GOOGLE_SEARCH_CONSOLE_KEY not configured — skipping API resubmit"
            echo "sc_status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "=== Resubmitting sitemaps to Google Search Console API ==="
          echo "sc_status=submitted" >> $GITHUB_OUTPUT
          echo "✅ Search Console API resubmission complete"

      - name: Post deployment summary
        if: always()
        env:
          SC_STATUS: ${{ steps.sc_resubmit.outputs.sc_status || 'skipped' }}
          SITEMAP_OK: ${{ steps.sitemap_check.outputs.sitemap_ok || 'false' }}
          PING_OK: ${{ steps.google_ping.outputs.ping_ok || 'false' }}
        run: |
          echo "## SEO Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Action | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "$SITEMAP_OK" = "true" ]; then
            echo "| Sitemap accessibility check | ✅ All 3 sitemaps live |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Sitemap accessibility check | ⚠️ Check sitemap URLs |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$PING_OK" = "true" ]; then
            echo "| Google sitemap ping | ✅ Pinged successfully |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Google sitemap ping | ⚠️ Ping may have failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$SC_STATUS" = "submitted" ]; then
            echo "| Search Console API resubmit | ✅ Submitted |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Search Console API resubmit | ℹ️ Add GOOGLE_SEARCH_CONSOLE_KEY to enable |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Sitemaps monitored:**" >> $GITHUB_STEP_SUMMARY
          echo "- https://www.ztvlivestream.com/sitemap.xml" >> $GITHUB_STEP_SUMMARY
          echo "- https://www.ztvlivestream.com/sitemap-pages.xml" >> $GITHUB_STEP_SUMMARY
          echo "- https://www.ztvlivestream.com/sitemap-videos.xml" >> $GITHUB_STEP_SUMMARY
